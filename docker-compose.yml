services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eduroll
      POSTGRES_USER: eduroll
      POSTGRES_PASSWORD: local-only-change-me
    ports:
      - "5432:5432"
    volumes:
      - eduroll-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduroll -d eduroll"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  eduroll-postgres:
